<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#232a56" />
    <meta
      name="description"
      content="Зимняя рыбалка — пиксельная рыбалка в трех водоемах со справочником и сохранением прогресса."
    />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!-- The wordmark uses Tiny5; the subsets the Russian UI needs are tiny, and
         preloading them lets the browser fetch them while the JS is parsing. -->
    <link
      rel="preload"
      href="%BASE_URL%assets/fishing/fonts/tiny5-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%assets/fishing/fonts/tiny5-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%BASE_URL%style.css" />
    <title>Зимняя рыбалка</title>
    <style>
      /* Painted before any JS, font or WebGL: the page is never blank. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #232a56;
        color: #eef2ff;
        font-family: "Courier New", monospace;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #boot-splash[data-state="done"] {
        opacity: 0;
      }
      .boot-title {
        font-size: clamp(20px, 4.2vw, 34px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-align: center;
        text-shadow: 0 2px 0 #141a3d;
      }
      .boot-track {
        width: min(220px, 46vw);
        height: 8px;
        padding: 1px;
        background: #3f4b91;
        box-shadow:
          inset 0 0 0 1px #141a3d,
          0 0 0 1px #141a3d;
      }
      .boot-fill {
        width: 34%;
        height: 100%;
        background: #8299e6;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-note {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c2cdf0;
      }
      #boot-splash[data-state="error"] .boot-fill {
        animation: none;
        width: 100%;
        background: #c04358;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fill {
          animation: none;
          width: 52%;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-title">ЗИМНЯЯ РЫБАЛКА</div>
      <div class="boot-track"><div class="boot-fill"></div></div>
      <p class="boot-note">загрузка</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
